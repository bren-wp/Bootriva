name: BOOTRIVA • Build and verify
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Core safety tests
        run: ctest --test-dir build --output-on-failure
  windows-packaging:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check embedded assistant PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $issues = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/create-windows-usb.ps1').Path,
            [ref]$tokens, [ref]$issues)
          if ($issues.Count) { $issues | Out-String | Write-Host; throw 'PowerShell helper parse errors' }
      - name: Package portable + NSIS setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build/Release/Bootriva.exe' 'dist/BOOTRIVA-Portable.exe'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { throw 'NSIS executable missing' }
          $app = (Resolve-Path 'build/Release/Bootriva.exe').Path
          $out = (Resolve-Path 'dist').Path
          & $nsis "/DAPP_EXE=$app" "/DOUT_DIR=$out" 'packaging/bootriva.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          foreach ($name in @('BOOTRIVA-Portable.exe','BOOTRIVA-Setup.exe')) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path $path)) { throw "Missing required release artifact: $name" }
            if ((Get-Item $path).Length -lt 10240) { throw "Suspiciously small artifact: $name" }
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash
            "$sha  $name" | Add-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          }
      - name: Upload mandatory release pair
        uses: actions/upload-artifact@v4
        with:
          name: BOOTRIVA-Windows-x64-unsigned
          path: |
            dist/BOOTRIVA-Portable.exe
            dist/BOOTRIVA-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  winui3-preview:
    name: Native WinUI 3 shell build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile self-contained WinUI 3 preview
        shell: pwsh
        run: |
          dotnet publish ui/Bootriva.Modern/Bootriva.Modern.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o modern-dist
          if ($LASTEXITCODE -ne 0) { throw 'WinUI 3 build failed' }
          $exe = 'modern-dist/Bootriva.Modern.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 1048576) {
            throw 'WinUI 3 preview binary missing or unexpectedly small'
          }
          Copy-Item $exe 'modern-dist/BOOTRIVA-WinUI3-Preview.exe'
          $hash = (Get-FileHash 'modern-dist/BOOTRIVA-WinUI3-Preview.exe' -Algorithm SHA256).Hash
          "$hash  BOOTRIVA-WinUI3-Preview.exe" | Set-Content -Encoding ascii 'modern-dist/SHA256SUMS-WINUI3.txt'
      - name: Upload genuine WinUI 3 preview
        uses: actions/upload-artifact@v4
        with:
          name: BOOTRIVA-WinUI3-x64-unsigned-preview
          path: |
            modern-dist/BOOTRIVA-WinUI3-Preview.exe
            modern-dist/SHA256SUMS-WINUI3.txt
          if-no-files-found: error
  publish-preview:
    name: Publish tested Portable and Setup
    needs: [linux-core, windows-packaging, winui3-preview]
    # This preview version is released exactly once on merge to main.
    # Future release versions should update preview_tag before merging.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: v0.2.5-preview.1
    steps:
      - name: Download verified Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: BOOTRIVA-Windows-x64-unsigned
          path: release
      - name: Download tested modern WinUI 3 binary
        uses: actions/download-artifact@v4
        with:
          name: BOOTRIVA-WinUI3-x64-unsigned-preview
          path: modern
      - name: Check artifacts and publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          test -s release/BOOTRIVA-Portable.exe
          test -s release/BOOTRIVA-Setup.exe
          test -s release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)
          (cd modern && sha256sum --check SHA256SUMS-WINUI3.txt)
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo "Prerelease $PREVIEW_TAG already exists; leaving it unchanged."
          else
            gh release create "$PREVIEW_TAG" \
              release/BOOTRIVA-Portable.exe \
              release/BOOTRIVA-Setup.exe \
              release/SHA256SUMS.txt \
              modern/BOOTRIVA-WinUI3-Preview.exe \
              modern/SHA256SUMS-WINUI3.txt \
              --target "${{ github.sha }}" \
              --title "BOOTRIVA $PREVIEW_TAG · Genuine WinUI 3 shell" \
              --notes "Experimental unsigned Windows preview. Both Portable and Setup are built and checked in CI. Adds an actual Windows App SDK WinUI 3 native XAML interface, official ISO catalog, ISO picker, read-only removable drive list and SHA-256. This separate WinUI preview does not write USB. Existing functional classic Portable and Setup retain the C++ engine until feature parity is safely achieved. Real USB hardware validation and genuine screenshots remain pending." \
              --prerelease
          fi
