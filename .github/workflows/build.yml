name: BOOTRIVA • Build and verify
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Core safety tests
        run: ctest --test-dir build --output-on-failure
  windows-packaging:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package portable + NSIS setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build/Release/Bootriva.exe' 'dist/BOOTRIVA-Portable.exe'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { throw 'NSIS executable missing' }
          $app = (Resolve-Path 'build/Release/Bootriva.exe').Path
          $out = (Resolve-Path 'dist').Path
          & $nsis "/DAPP_EXE=$app" "/DOUT_DIR=$out" 'packaging/bootriva.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          foreach ($name in @('BOOTRIVA-Portable.exe','BOOTRIVA-Setup.exe')) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path $path)) { throw "Missing required release artifact: $name" }
            if ((Get-Item $path).Length -lt 10240) { throw "Suspiciously small artifact: $name" }
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash
            "$sha  $name" | Add-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          }
      - name: Upload mandatory release pair
        uses: actions/upload-artifact@v4
        with:
          name: BOOTRIVA-Windows-x64-unsigned
          path: |
            dist/BOOTRIVA-Portable.exe
            dist/BOOTRIVA-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Release only on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          # Failed test/build/packaging steps prevent reaching this point.
          gh release create "${{ github.ref_name }}" `
            'dist/BOOTRIVA-Portable.exe' 'dist/BOOTRIVA-Setup.exe' 'dist/SHA256SUMS.txt' `
            --title "BOOTRIVA ${{ github.ref_name }}" --generate-notes --prerelease
